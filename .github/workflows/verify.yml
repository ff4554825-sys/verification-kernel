name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # keyless attestation: cosign exchanges this for a short-lived certificate
    env:
      VERIFICATION_SIGNING_KEY_PEM: ${{ secrets.VERIFICATION_SIGNING_KEY_PEM }}
      VERIFICATION_PUBLIC_KEY_PEM: ${{ secrets.VERIFICATION_PUBLIC_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize optional signing keys
        if: ${{ env.VERIFICATION_SIGNING_KEY_PEM != '' }}
        run: |
          printf '%s' "$VERIFICATION_SIGNING_KEY_PEM" > "$RUNNER_TEMP/verification.key"
          printf '%s' "$VERIFICATION_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/verification.pub"
          echo "VERIFICATION_SIGNING_KEY=$RUNNER_TEMP/verification.key" >> "$GITHUB_ENV"
          echo "VERIFICATION_PUBLIC_KEY=$RUNNER_TEMP/verification.pub" >> "$GITHUB_ENV"
      - name: Run deterministic verification
        run: bash ci/verify.sh
      - name: L2 PR review + isolated QA
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          node bin/pr-check.js \
            --base "origin/${{ github.base_ref }}" \
            --qa-command '["bash","ci/verify.sh"]' \
            --json
      - name: Install cosign
        if: hashFiles('.dsh/verification/latest.json') != ''
        uses: sigstore/cosign-installer@v3
      - name: Attest the verdict keyless
        if: hashFiles('.dsh/verification/latest.json') != ''
        run: |
          node bin/attest.js sign \
            --file .dsh/verification/latest.json \
            --bundle .dsh/verification/verdict.sigstore.json
      - name: Verify the bundle against this workflow identity
        if: hashFiles('.dsh/verification/verdict.sigstore.json') != ''
        run: |
          node bin/attest.js verify \
            --file .dsh/verification/latest.json \
            --bundle .dsh/verification/verdict.sigstore.json \
            --identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            .dsh/verification
            .dsh/pr-check
